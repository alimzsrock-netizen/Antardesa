<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="theme.js"></script>
<meta name="theme-color" content="#16805d">

<title>Masuk | AntarDesa</title>

<link rel="stylesheet" href="style.css">

<style>
.auth-container {
  max-width: 420px;
  margin: 45px auto;
  padding: 22px;
}

.auth-card {
  background: white;
  padding: 25px;
  border-radius: 18px;
  border: 1px solid #e2e9e4;
}

.logo {
  text-align: center;
  color: #16805d;
  margin-bottom: 25px;
}

.logo h1 {
  margin-bottom: 5px;
}

.logo p {
  color: #61746b;
  font-size: 13px;
}

label {
  display: block;
  margin: 15px 0 7px;
  font-size: 13px;
  font-weight: bold;
}

input {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  border: 1px solid #ccd9d0;
  border-radius: 10px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  background: #16805d;
  color: white;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.65;
  cursor: wait;
}

.note {
  text-align: center;
  font-size: 13px;
  margin-top: 20px;
}

#message {
  margin-top: 15px;
  font-size: 13px;
  text-align: center;
  line-height: 1.5;
}

a {
  color: #16805d;
}
</style>
<link rel="stylesheet" href="premium-theme.css">

</head>

<body>

<main class="auth-container">

  <div class="logo">
    <h1>AntarDesa.</h1>
    <p>Dekatkan Jarak, Mudahkan Urusan.</p>
  </div>

  <div class="auth-card">

    <h2>Selamat Datang 👋</h2>

    <p>Masuk ke akun AntarDesa</p>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Masukkan email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Masuk
      </button>

    </form>

    <p
      id="message"
      role="status"
      aria-live="polite"
    ></p>

    <p class="note">
      Belum punya akun?
      <a href="register.html">Daftar sekarang</a>
    </p>

    <p class="note">
      <a href="index.html">← Kembali ke Beranda</a>
    </p>

    <p class="note" style="color:#777">
      AntarDesa v0.3.0-RC
    </p>

  </div>

</main>

<!-- SUPABASE SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
"use strict";


/* =========================================
   KONFIGURASI SUPABASE
========================================= */

const SUPABASE_URL =
  "https://gswlkajcizcvrhcfabtg.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_fYFVBQDDVi3qrdVYq45I4Q_C4MTqN63";


/* =========================================
   ELEMEN HALAMAN
========================================= */

const message =
  document.getElementById("message");

const loginButton =
  document.getElementById("loginButton");

const loginForm =
  document.getElementById("loginForm");


/* =========================================
   PESAN STATUS
========================================= */

function showMessage(text, isError) {

  message.textContent = text;

  message.style.color =
    isError ? "#b42318" : "#16805d";

}


/* =========================================
   INISIALISASI SUPABASE
========================================= */

let supabaseClient = null;

if (
  window.supabase &&
  window.supabase.createClient
) {

  supabaseClient = window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_PUBLISHABLE_KEY,

    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        storage: window.localStorage
      }
    }

  );

} else {

  loginButton.disabled = true;

  showMessage(
    "Koneksi Supabase belum siap. Periksa koneksi internet.",
    true
  );

}


/* =========================================
   PROSES LOGIN
========================================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    if (!supabaseClient) {

      showMessage(
        "Koneksi Supabase belum tersedia.",
        true
      );

      return;

    }

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    loginButton.disabled = true;

    loginButton.textContent =
      "Memproses...";

    showMessage(
      "Sedang memeriksa akun...",
      false
    );

    let redirecting = false;

    try {

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({

          email: email,
          password: password

        });

      if (error) {
        throw error;
      }

      if (!data.session || !data.user) {

        throw new Error("SESSION_NOT_FOUND");

      }

      /*
        LOGIN BERHASIL.

        Jangan langsung memeriksa user_roles di sini.
        Jangan menjalankan signOut karena pemeriksaan
        peran belum dilakukan.

        Dashboard utama akan memeriksa peran pengguna.
      */

      showMessage(
        "Login berhasil. Membuka dashboard utama...",
        false
      );

      redirecting = true;

      /*
        KEMBALI KE TUJUAN YANG DIMINTA SEBELUM LOGIN.

        Hanya izinkan tujuan internal yang sudah ditentukan.
        Parameter URL dari luar tidak boleh menjadi alamat redirect.
      */
      const loginReturnParams =
        new URLSearchParams(window.location.search);

      const requestedReturnTo =
        loginReturnParams.get("returnTo");

      let postLoginDestination = "index.html";

      if (requestedReturnTo === "cart") {

        postLoginDestination =
          "index.html?returnTo=cart";

      } else if (requestedReturnTo === "product") {

        const requestedProductId =
          loginReturnParams.get("productId");

        if (requestedProductId) {

          const safeReturnParams =
            new URLSearchParams();

          safeReturnParams.set("returnTo", "product");
          safeReturnParams.set("productId", requestedProductId);

          postLoginDestination =
            "index.html?" + safeReturnParams.toString();

        }

      }

      window.location.replace(postLoginDestination);

    } catch (error) {

      console.error(
        "Login gagal:",
        error
      );

      const errorText =
        String(error.message || "").toLowerCase();

      if (
        errorText.includes(
          "invalid login credentials"
        )
      ) {

        showMessage(
          "Email atau password salah, atau akun belum tersedia.",
          true
        );

      } else if (
        errorText.includes(
          "email not confirmed"
        )
      ) {

        showMessage(
          "Silakan konfirmasi alamat email melalui pesan dari Supabase.",
          true
        );

      } else if (
        error.message === "SESSION_NOT_FOUND"
      ) {

        showMessage(
          "Login belum menghasilkan sesi. Silakan coba lagi.",
          true
        );

      } else {

        showMessage(
          "Login belum berhasil. Periksa koneksi internet atau coba lagi.",
          true
        );

      }

    } finally {

      if (!redirecting) {

        loginButton.disabled = false;

        loginButton.textContent =
          "Masuk";

      }

    }

  }
);

</script>

</body>
</html>
