
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Masuk | AntarDesa</title>

<link rel="stylesheet" href="style.css">

<style>
.auth-container {
  max-width: 420px;
  margin: 45px auto;
  padding: 22px;
}

.auth-card {
  background: white;
  padding: 25px;
  border-radius: 18px;
  border: 1px solid #e2e9e4;
}

.logo {
  text-align: center;
  color: #16805d;
  margin-bottom: 25px;
}

.logo h1 {
  margin-bottom: 5px;
}

.logo p {
  color: #61746b;
  font-size: 13px;
}

label {
  display: block;
  margin: 15px 0 7px;
  font-size: 13px;
  font-weight: bold;
}

input {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  border: 1px solid #ccd9d0;
  border-radius: 10px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  background: #16805d;
  color: white;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.65;
  cursor: wait;
}

.note {
  text-align: center;
  font-size: 13px;
  margin-top: 20px;
}

#message {
  margin-top: 15px;
  font-size: 13px;
  text-align: center;
  line-height: 1.5;
}

a {
  color: #16805d;
}
</style>
</head>

<body>

<main class="auth-container">

  <div class="logo">
    <h1>AntarDesa.</h1>
    <p>Dekatkan Jarak, Mudahkan Urusan.</p>
  </div>

  <div class="auth-card">

    <h2>Selamat Datang 👋</h2>
    <p>Masuk ke akun AntarDesa</p>

    <form id="loginForm">

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Masukkan email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Masuk
      </button>

    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p class="note">
      Belum punya akun?
      <a href="register.html">Daftar sekarang</a>
    </p>

    <p class="note">
      <a href="index.html">← Kembali ke Beranda</a>
    </p>

    <p class="note" style="color:#777">
      AntarDesa v0.2.0
    </p>

  </div>

</main>

<!-- Supabase JavaScript SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
"use strict";

/*
  Konfigurasi Supabase AntarDesa.
  Hanya gunakan publishable key.
  Jangan memasukkan secret key.
*/

const SUPABASE_URL =
  "https://gswlkajcizcvrhcfabtg.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_fYFVBQDDVi3qrdVYq45I4Q_C4MTqN63";

const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");
const loginForm = document.getElementById("loginForm");

function showMessage(text, isError = false) {
  message.textContent = text;
  message.style.color = isError ? "#b42318" : "#16805d";
}

const isConfigured =
  SUPABASE_PUBLISHABLE_KEY.startsWith("sb_publishable_");

let supabaseClient = null;

if (isConfigured && window.supabase) {
  supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
} else {
  loginButton.disabled = true;
  showMessage(
    "Koneksi Supabase belum siap. Periksa konfigurasi aplikasi.",
    true
  );
}

/*
  Menentukan tujuan berdasarkan peran resmi
  dari database, bukan metadata registrasi.
*/

async function getRedirectPage(userId) {

  const { data: userRole, error } =
    await supabaseClient
      .from("user_roles")
      .select("role,is_verified")
      .eq("user_id", userId)
      .single();

  if (error || !userRole) {
    throw new Error("ROLE_NOT_FOUND");
  }

  if (userRole.role === "pelanggan") {
    return "pelanggan.html";
  }

  if (
    userRole.role === "mitra" &&
    userRole.is_verified === true
  ) {
    return "mitra.html";
  }

  if (
    userRole.role === "kurir" &&
    userRole.is_verified === true
  ) {
    return "kurir.html";
  }

  throw new Error("ROLE_NOT_ALLOWED");
}

loginForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  if (!supabaseClient) {
    showMessage("Koneksi Supabase belum tersedia.", true);
    return;
  }

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  loginButton.disabled = true;
  loginButton.textContent = "Memproses...";

  showMessage("Sedang memeriksa akun...");

  let redirecting = false;

  try {

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      throw error;
    }

    if (!data.session || !data.user) {
      throw new Error("SESSION_NOT_FOUND");
    }

    showMessage("Login berhasil. Memeriksa hak akses...");

    let destination;

    try {
      destination = await getRedirectPage(data.user.id);

    } catch (roleError) {

      // Jangan mempertahankan sesi jika pemeriksaan
      // hak akses tidak berhasil.
      await supabaseClient.auth.signOut();

      throw roleError;
    }

    showMessage("Hak akses terverifikasi. Mengalihkan halaman...");

    redirecting = true;

    window.location.replace(destination);

  } catch (error) {

    console.error("Login gagal:", error.message);

    const errorText =
      String(error.message || "").toLowerCase();

    if (error.message === "ROLE_NOT_FOUND") {

      showMessage(
        "Peran akun belum ditemukan. Hubungi pengelola AntarDesa.",
        true
      );

    } else if (error.message === "ROLE_NOT_ALLOWED") {

      showMessage(
        "Hak akses akun belum valid. Hubungi pengelola AntarDesa.",
        true
      );

    } else if (errorText.includes("invalid login credentials")) {

      showMessage(
        "Email atau password salah, atau akun belum tersedia.",
        true
      );

    } else if (errorText.includes("email not confirmed")) {

      showMessage(
        "Silakan konfirmasi alamat email melalui pesan dari Supabase.",
        true
      );

    } else {

      showMessage(
        "Login belum berhasil. Periksa koneksi internet atau coba lagi.",
        true
      );

    }

  } finally {

    if (!redirecting) {
      loginButton.disabled = false;
      loginButton.textContent = "Masuk";
    }

  }

});
</script>

</body>
</html>
