
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Uji Akses Mitra | AntarDesa</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:24px 16px;
 background:#f5f8f6;
 font-family:Arial,sans-serif;
 color:#20352a;
}

main{
 max-width:500px;
 margin:30px auto;
 background:white;
 padding:22px;
 border:1px solid #dce8df;
 border-radius:16px;
}

h2{color:#16805d}

p{
 font-size:14px;
 line-height:1.6;
}

input{
 width:100%;
 padding:13px;
 border:1px solid #ccd9d0;
 border-radius:9px;
 font-size:15px;
}

button{
 width:100%;
 margin-top:14px;
 padding:13px;
 background:#16805d;
 color:white;
 border:0;
 border-radius:9px;
 font-weight:bold;
}

button:disabled{opacity:.6}

#result{
 margin-top:18px;
 padding:14px;
 border-radius:9px;
 background:#f1f5f9;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 font-size:14px;
 line-height:1.6;
}

.success{
 background:#dcfce7!important;
 color:#166534;
}

.danger{
 background:#fee2e2!important;
 color:#991b1b;
}

.warning{
 background:#fff4d6!important;
 color:#805900;
}
</style>
</head>

<body>

<main>

<h2>🔐 Uji Akses Antar-Mitra</h2>

<p>
Tahap 7.1.53D.1.
Masuk sebagai Mitra B, kemudian masukkan ID pesanan
milik Mitra A.
</p>

<p id="accountStatus">
Memeriksa akun...
</p>

<label for="orderId">
<strong>ID Pesanan Mitra A</strong>
</label>

<input
 id="orderId"
 type="text"
 placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
 autocomplete="off"
 spellcheck="false"
 maxlength="36"
>

<button id="testButton" type="button" disabled>
Uji Keamanan Akses
</button>

<div id="result" role="status" aria-live="polite">
Belum dilakukan pengujian.
</div>

<p>
Halaman ini hanya menghitung jumlah baris.
Data pribadi penerima tidak ditampilkan.
</p>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
"use strict";

const SUPABASE_URL =
 "https://gswlkajcizcvrhcfabtg.supabase.co";

const SUPABASE_KEY =
 "sb_publishable_fYFVBQDDVi3qrdVYq45I4Q_C4MTqN63";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const $ = id => document.getElementById(id);

let currentUserId = null;
let ready = false;
let testing = false;

function showResult(message,type=""){
 const element = $("result");
 element.className = type;
 element.textContent = message;
}

async function checkAccount(){

 try{

  const {data,error} = await db.auth.getUser();

  if(error || !data?.user){
   throw new Error(
    "Belum login. Masuk sebagai Mitra B terlebih dahulu."
   );
  }

  currentUserId = data.user.id;

  const {data:role,error:roleError} = await db
   .from("user_roles")
   .select("role,is_verified")
   .eq("user_id",currentUserId)
   .single();

  if(roleError || !role){
   throw new Error(
    "Hak akses akun tidak dapat diverifikasi."
   );
  }

  if(role.role !== "mitra" || role.is_verified !== true){
   throw new Error(
    "Akun aktif bukan Mitra terverifikasi."
   );
  }

  ready = true;

  $("accountStatus").textContent =
   "✅ Akun Mitra terverifikasi. " +
   "Pastikan akun ini adalah Mitra B.";

  $("testButton").disabled = false;

 }catch(error){

  $("accountStatus").textContent =
   "❌ " + error.message;

  showResult(
   "Pengujian belum dapat dijalankan.",
   "warning"
  );

 }

}

$("testButton").addEventListener("click",async()=>{

 if(!ready || testing) return;

 const orderId = $("orderId").value.trim();

 const uuidPattern =
  /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

 if(!uuidPattern.test(orderId)){
  showResult(
   "Masukkan ID pesanan UUID lengkap yang valid.",
   "warning"
  );
  return;
 }

 testing = true;
 $("testButton").disabled = true;

 showResult("Sedang menguji akses...");

 try{

  // Verifikasi ulang identitas sebelum memanggil RPC.

  const {data:auth,error:authError} =
   await db.auth.getUser();

  if(authError || auth?.user?.id !== currentUserId){
   throw new Error(
    "Sesi akun berubah. Muat ulang halaman."
   );
  }

  const {data,error} = await db.rpc(
   "get_antardesa_merchant_delivery_details",
   {
    p_order_id:orderId
   }
  );

  if(error){
   showResult(
    "RPC MENGEMBALIKAN ERROR.\n" +
    "Pengujian belum dapat dinyatakan lulus.\n" +
    "Keterangan: " + error.message,
    "warning"
   );
   return;
  }

  if(!Array.isArray(data)){
   showResult(
    "Respons tidak sesuai format yang diharapkan.",
    "warning"
   );
   return;
  }

  // Jangan tampilkan isi data, hanya jumlah baris.

  if(data.length === 0){

   showResult(
    "AKSES DITOLAK (0 BARIS)\n" +
    "LULUS: Mitra B tidak menerima detail pesanan tersebut.",
    "success"
   );

  }else{

   showResult(
    "PERINGATAN KEAMANAN!\n" +
    "RPC mengembalikan " + data.length + " baris.\n" +
    "Jangan lanjutkan sebelum akses diperiksa.",
    "danger"
   );

  }

 }catch(error){

  showResult(
   "Pengujian mengalami kendala:\n" +
   error.message,
   "warning"
  );

 }finally{

  testing = false;
  $("testButton").disabled = false;

 }

});

checkAccount();
</script>

</body>
</html>
