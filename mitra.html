<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Mitra - AntarDesa</title>
  <link rel="stylesheet" href="ui-components.css">
  <style>
    * { box-sizing: border-box; }
    
    :root {
      --bg-color: #f4f7f5;
      --text-color: #1c3028;
      --panel-bg: #ffffff;
      --panel-border: #e3ebe6;
      --muted-color: #61746b;
      --input-bg: #ffffff;
      --input-border: #cbd9d0;
      --header-bg: #16805d;
      --card-sub-bg: #f8fbf9;
      --accent-color: #16805d;
      --font-scale: 15px;
    }

    html.dark-theme {
      --bg-color: #121e19;
      --text-color: #e2ebe6;
      --panel-bg: #1a2923;
      --panel-border: #283d34;
      --muted-color: #9cb3a8;
      --input-bg: #22342c;
      --input-border: #354e42;
      --header-bg: #0f5c43;
      --card-sub-bg: #16241e;
      --accent-color: #24a177;
    }

    body { 
      margin: 0; 
      background: var(--bg-color); 
      color: var(--text-color); 
      font: var(--font-scale) Arial, sans-serif; 
    }

    header { 
      background: var(--header-bg); 
      color: white; 
      padding: 20px 18px; 
      border-radius: 0 0 20px 20px; 
    }
    .header-inner { max-width: 650px; margin: auto; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.5em; }
    header p { margin: 4px 0 0; font-size: 0.8em; opacity: 0.9; }

    main { max-width: 650px; margin: auto; padding: 18px 16px 40px; }

    .panel { 
      background: var(--panel-bg); 
      border: 1px solid var(--panel-border); 
      border-radius: 16px; 
      padding: 18px; 
      margin-bottom: 18px; 
    }
    .panel h2 { margin: 0 0 8px; font-size: 1.2em; }
    .muted { color: var(--muted-color); font-size: 0.85em; line-height: 1.5; }

    .primary { 
      background: var(--accent-color); 
      color: white; 
      border: 0; 
      border-radius: 10px; 
      padding: 10px 14px; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 0.9em;
    }
    .secondary { 
      background: var(--panel-bg); 
      color: var(--accent-color); 
      border: 1px solid var(--accent-color); 
      border-radius: 10px; 
      padding: 10px 14px; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 0.9em;
    }
    .danger-btn {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9em;
    }

    button:disabled { opacity: 0.6; cursor: wait; }
    .hidden { display: none !important; }

    /* KARTU PESANAN MITRA */
    .merchant-order-card {
      background: var(--card-sub-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .order-status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75em;
      font-weight: bold;
    }
    .status-pending { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .status-processing { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .status-delivering { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
    .status-completed { background: #e5e7eb; color: #374151; border: 1px solid #d1d5db; }

    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--panel-border);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div>
        <h1>Dashboard Mitra 🏪</h1>
        <p>Kelola pesanan masuk dan produk usaha desa</p>
      </div>
      <a href="index.html" style="color:white; text-decoration:none; font-size:0.85em; font-weight:bold; background:rgba(255,255,255,0.2); padding:6px 10px; border-radius:8px;">← Beranda</a>
    </div>
  </header>

  <main>
    <div class="panel">
      <h2>Pesanan Masuk (Real-Time) 📦</h2>
      <p class="muted">Daftar pesanan dari pelanggan yang ditujukan ke toko/usaha Anda.</p>
      
      <div id="merchantOrdersList">
        <p class="muted" style="text-align:center; padding:20px;">Memuat daftar pesanan masuk...</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    "use strict";

    const SUPABASE_URL = "https://gswlkajcizcvrhcfabtg.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_fYFVBQDDVi3qrdVYq45I4Q_C4MTqN63";

    let supabaseClient = null;
    let currentUser = null;
    let merchantOrders = [];
    let realtimeChannel = null;

    const rupiahFormatter = new Intl.NumberFormat("id-ID", {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    });

    function formatPrice(val) {
      const num = Number(val);
      return Number.isFinite(num) ? rupiahFormatter.format(num) : "Rp0";
    }

    async function initSupabase() {
      if (!window.supabase || !window.supabase.createClient) {
        document.getElementById("merchantOrdersList").innerHTML = '<p class="muted" style="color:#991b1b; text-align:center;">Gagal memuat pustaka Supabase.</p>';
        return;
      }

      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storage: window.localStorage }
      });

      const { data: sessionData } = await supabaseClient.auth.getSession();
      if (!sessionData || !sessionData.session || !sessionData.session.user) {
        alert("Silakan masuk terlebih dahulu dengan akun Mitra.");
        window.location.href = "login.html";
        return;
      }

      currentUser = sessionData.session.user;
      loadMerchantOrders();
      initRealtime();
    }

    async function loadMerchantOrders() {
      if (!supabaseClient || !currentUser) return;
      
      const container = document.getElementById("merchantOrdersList");

      try {
        // Ambil pesanan di mana mitra_id atau merchant_id adalah user yang sedang login
        const { data, error } = await supabaseClient
          .from("orders")
          .select("id,status,total_amount,shipping_fee,address_snapshot,created_at,customer_id")
          .or(`mitra_id.eq.${currentUser.id},merchant_id.eq.${currentUser.id}`)
          .order("created_at", { ascending: false });

        if (error) throw error;

        merchantOrders = Array.isArray(data) ? data : [];
        renderMerchantOrders();
      } catch (err) {
        console.error("Gagal memuat pesanan mitra:", err);
        container.innerHTML = '<p class="muted" style="color:#991b1b; text-align:center;">Gagal mengambil data pesanan dari server.</p>';
      }
    }

    function renderMerchantOrders() {
      const container = document.getElementById("merchantOrdersList");
      container.replaceChildren();

      if (merchantOrders.length === 0) {
        container.innerHTML = '<p class="muted" style="text-align:center; padding:20px;">Belum ada pesanan masuk untuk usaha Anda.</p>';
        return;
      }

      merchantOrders.forEach(ord => {
        const card = document.createElement("div");
        card.className = "merchant-order-card";

        const topRow = document.createElement("div");
        topRow.style.cssText = "display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;";

        const title = document.createElement("strong");
        title.style.fontSize = "0.9em";
        title.textContent = "Pesanan #" + ord.id.substring(0, 8).toUpperCase();

        const badge = document.createElement("span");
        badge.className = "order-status-badge ";
        if (ord.status === "pending_confirmation") { badge.classList.add("status-pending"); badge.textContent = "Menunggu Konfirmasi"; }
        else if (ord.status === "processing") { badge.classList.add("status-processing"); badge.textContent = "Diproses Mitra"; }
        else if (ord.status === "finding_courier") { badge.classList.add("status-pending"); badge.textContent = "Mencari Kurir"; }
        else if (ord.status === "delivering") { badge.classList.add("status-delivering"); badge.textContent = "Dalam Pengantaran"; }
        else if (ord.status === "completed") { badge.classList.add("status-completed"); badge.textContent = "Selesai"; }
        else { badge.classList.add("status-pending"); badge.textContent = ord.status; }

        topRow.append(title, badge);

        const info = document.createElement("div");
        info.style.cssText = "font-size:0.85em; line-height:1.5; color:var(--text-color); margin-bottom:8px;";
        info.innerHTML = `<strong>Total Pembayaran:</strong> ${formatPrice(ord.total_amount)}<br><strong>Alamat Pengantaran:</strong> ${ord.address_snapshot}`;

        card.append(topRow, info);

        // TOMBOL AKSI MITRA
        const actionRow = document.createElement("div");
        actionRow.className = "action-row";

        if (ord.status === "pending_confirmation") {
          const btnProcess = document.createElement("button");
          btnProcess.className = "primary";
          btnProcess.textContent = "✔ Terima & Proses Pesanan";
          btnProcess.addEventListener("click", () => updateOrderStatus(ord.id, "processing"));
          actionRow.append(btnProcess);
        }

        if (ord.status === "processing") {
          const btnCourier = document.createElement("button");
          btnCourier.className = "primary";
          btnCourier.textContent = "🛵 Cari Kurir Pengantaran";
          btnCourier.addEventListener("click", () => updateOrderStatus(ord.id, "finding_courier"));
          actionRow.append(btnCourier);
        }

        if (ord.status !== "completed" && ord.status !== "cancelled") {
          const btnCancel = document.createElement("button");
          btnCancel.className = "danger-btn";
          btnCancel.textContent = "Batalkan";
          btnCancel.addEventListener("click", () => updateOrderStatus(ord.id, "cancelled"));
          actionRow.append(btnCancel);
        }

        if (actionRow.children.length > 0) {
          card.append(actionRow);
        }

        container.append(card);
      });
    }

    async function updateOrderStatus(orderId, newStatus) {
      if (!supabaseClient) return;
      if (!confirm("Apakah Anda yakin ingin mengubah status pesanan ini menjadi: " + newStatus + "?")) return;

      try {
        const { error } = await supabaseClient
          .from("orders")
          .update({ status: newStatus, updated_at: new Date().toISOString() })
          .eq("id", orderId);

        if (error) throw error;

        alert("Status pesanan berhasil diperbarui!");
        loadMerchantOrders();
      } catch (err) {
        console.error("Gagal memperbarui status:", err);
        alert("Gagal memperbarui status pesanan: " + (err.message || "Kesalahan server"));
      }
    }

    function initRealtime() {
      if (!supabaseClient || realtimeChannel) return;

      realtimeChannel = supabaseClient
        .channel("merchant_orders_realtime")
        .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, payload => {
          console.log("Realtime merchant update:", payload);
          loadMerchantOrders();
        })
        .subscribe();
    }

    document.addEventListener("DOMContentLoaded", initSupabase);
  </script>
</body>
</html>
